[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalquant"
version = "0.1.0"
description = "VitalQuant — wearable multimodal physiological sensing research platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

# Optional extras keep the laptop install light (spec §36):
#   pip install -e ".[ingest,processing,ml,dashboard,dev]"
[project.optional-dependencies]
ingest = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
]
processing = [
    "scipy>=1.10",
    "pandas>=2.0",
    "asyncpg>=0.29",
]
ml = [
    "scikit-learn>=1.3",
]
datasets = [
    "wfdb>=4.1",
]
dashboard = [
    "streamlit>=1.32",
    "plotly>=5.18",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "ruff>=0.3",
]

[project.scripts]
vitalquant-worker = "vitalquant.processing.worker:main"
vitalquant-synth  = "vitalquant.synth.device:main"
vitalquant-migrate = "vitalquant.ingest.migrate:main"
vitalquant-device = "vitalquant.ingest.devices:main"
vitalquant-quantum = "vitalquant.quantum.experiment:main"
vitalquant-experiment = "vitalquant.ml.experiments:main"
vitalquant-import = "vitalquant.datasets.importer:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vitalquant*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
