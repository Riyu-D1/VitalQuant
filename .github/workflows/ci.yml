name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vitalquant
          POSTGRES_PASSWORD: vitalquant
          POSTGRES_DB: vitalquant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitalquant" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install
        run: pip install -e ".[ingest,processing,ml,dev]"
      - name: ruff
        run: ruff check src tests
      - name: migrate
        env:
          DATABASE_URL: postgresql://vitalquant:vitalquant@localhost:5432/vitalquant
        run: vitalquant-migrate
      - name: pytest
        env:
          DATABASE_URL: postgresql://vitalquant:vitalquant@localhost:5432/vitalquant
          VITALQUANT_AUTH_MODE: local
        run: pytest -q

  hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fab zip present
        run: test -s hardware/pcb/fab/VitalQ_v2_fixv24_fabrication.zip
