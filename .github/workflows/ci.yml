name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vitalq
          POSTGRES_PASSWORD: vitalq
          POSTGRES_DB: vitalq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitalq" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install
        run: pip install -e ".[ingest,processing,ml,dev]"
      - name: ruff
        run: ruff check src tests
      - name: migrate
        env:
          DATABASE_URL: postgresql://vitalq:vitalq@localhost:5432/vitalq
        run: vitalq-migrate
      - name: pytest
        env:
          DATABASE_URL: postgresql://vitalq:vitalq@localhost:5432/vitalq
          VITALQ_AUTH_MODE: local
        run: pytest -q

  hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kicad 9
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
      - name: skidl
        run: |
          python3 -m venv /tmp/skidl
          /tmp/skidl/bin/pip install -r hardware/pcb/requirements.txt
      - name: regenerate and erc
        env:
          SKIDL_PYTHON: /tmp/skidl/bin/python
        run: hardware/pcb/check.sh
