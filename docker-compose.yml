# Local dev: Postgres only (Supabase hosts prod DB). Keeps the laptop light.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vitalquant
      POSTGRES_PASSWORD: vitalquant          # local dev only
      POSTGRES_DB: vitalquant
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalquant"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://vitalquant:vitalquant@db:5432/vitalquant
      VITALQUANT_AUTH_MODE: local
    ports: ["8000:8000"]
    profiles: ["api"]

volumes:
  pgdata:
